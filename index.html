<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Journey ❤️</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MÀN HÌNH KHÓA -->
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h2>Bảo mật tình yêu 🔒</h2>
            <p>Hãy nhập sinh nhật bạn theo dạng ngày tháng</p>
            <input type="password" id="passcodeInput" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">
            <p id="errorMessage" class="error-msg">Quên sinh nhật mình rồi à 🥺</p>
        </div>
    </div>

    <!-- NỘI DUNG CHÍNH -->
    <div id="mainContent" style="display: none;">
        
        <!-- Thanh Điều Hướng -->
        <div class="top-nav">
            <div>
                <h1>Love Journey ❤️</h1>
                <!-- Lời chào người dùng -->
                <p id="userGreeting" style="color: var(--primary-color); font-weight: 600; margin-top: 5px;"></p>
            </div>
            <button class="btn-add" id="openFormBtn">➕ Thêm kỷ niệm</button>
        </div>

        <!-- Khung đăng ký / sửa sự kiện -->
        <div class="form-modal" id="formModal">
            <div class="form-container">
                <span class="close-form-btn" id="closeFormBtn">&times;</span>
                <h2 class="form-heading" id="formHeading">Thêm kỷ niệm mới 💌</h2>
                
                <form id="eventForm">
                    <input type="date" id="dateInput" required>
                    <input type="text" id="titleInput" placeholder="Tên sự kiện (VD: Lần đầu hẹn hò...)" required>
                    
                    <div class="editor-wrapper">
                        <div class="editor-toolbar">
                            <button type="button" class="toolbar-btn" onclick="formatDoc('bold')" title="Chữ đậm"><b>B</b></button>
                            <button type="button" class="toolbar-btn" onclick="formatDoc('italic')" title="Chữ nghiêng"><i>I</i></button>
                            <button type="button" class="toolbar-btn" onclick="formatDoc('underline')" title="Gạch chân"><u>U</u></button>
                            <button type="button" class="toolbar-btn" onclick="formatDoc('strikeThrough')" title="Gạch ngang"><s>S</s></button>
                            
                            <div class="color-picker-group" title="Màu chữ">
                                <span>🎨 Chữ</span>
                                <input type="color" value="#ff6b81" onchange="formatDoc('foreColor', this.value)">
                            </div>
                            <div class="color-picker-group" title="Màu nền chữ">
                                <span>✨ Nền</span>
                                <input type="color" value="#ffeef2" onchange="formatDoc('hiliteColor', this.value)">
                            </div>
                        </div>
                        <div id="contentInput" class="rich-editor" contenteditable="true" data-placeholder="Ghi chú chung cho kỷ niệm..."></div>
                    </div>

                    <!-- Khung nhập Link ảnh -->
                    <input type="text" id="imagesInput" placeholder="Link ảnh (Tùy chọn)">
                    <span class="helper-text">Nếu có nhiều ảnh, hãy ngăn cách bằng dấu phẩy (,).</span>

                    <!-- Ô NHẬP CẢM NGHĨ CÁ NHÂN -->
                    <div style="margin-bottom: 20px; margin-top: 10px;">
                        <label for="feelingInput" style="font-weight: 600; color: var(--primary-color); display: block; margin-bottom: 5px;">Cảm nghĩ của riêng bạn 💭</label>
                        <textarea id="feelingInput" rows="3" placeholder="Bạn cảm thấy thế nào về sự kiện này? (Chỉ mình bạn sửa được phần này)"></textarea>
                    </div>
                    
                    <button type="submit" class="btn-submit" id="submitBtn">Lưu Kỷ Niệm 💌</button>
                </form>
            </div>
        </div>

        <!-- Nơi hiển thị Timeline -->
        <div class="timeline" id="timeline">
            <p style="text-align:center; color:#888;">Đang tải kỷ niệm của chúng mình...</p>
        </div>

        <!-- Modal Slider Ảnh -->
        <div class="slider-modal" id="sliderModal">
            <div class="modal-content">
                <span class="close-slider-btn" id="closeSliderBtn">&times;</span>
                <div class="swiper mySwiper">
                    <div class="swiper-wrapper" id="swiperWrapper"></div>
                    <div class="swiper-button-next"></div>
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-pagination"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- Thư viện Javascript Swiper -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
    
    <!-- KHÔNG CÒN GỌI firebase-config.js NỮA, GỌI TRỰC TIẾP script.js -->
    <script type="module" src="script.js"></script>
</body>
</html>
